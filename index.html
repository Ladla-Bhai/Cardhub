<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CardHub Gift Cards</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:Arial;background:#f3f6fc;margin:0;color:#10203c}
header{background:#071326;color:white;padding:22px;text-align:center}
main{max-width:950px;margin:25px auto;padding:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:15px}
.card,.panel{background:white;padding:20px;border-radius:12px;box-shadow:0 3px 12px #0001}
button{padding:10px 14px;background:#1268f5;color:white;border:0;border-radius:7px;cursor:pointer}
input{display:block;padding:10px;margin:8px 0;width:90%;max-width:350px}
.price{font-size:22px;color:#087a52;font-weight:bold}
#adminPanel{display:none}
small{color:#60718d}
</style>
</head>
<body>
<header>
<h1>🎁 CardHub</h1>
<p>Gift Cards Made Easy</p>
</header>

<main>
<h2>Available Gift Cards</h2>
<div id="status">Website loading...</div>
<div id="products" class="grid"></div>

<section class="panel" style="margin-top:25px">
<h2>Admin Login</h2>
<input id="email" type="email" placeholder="Admin email">
<input id="password" type="password" placeholder="Password">
<button id="loginBtn">Login</button>
<button id="logoutBtn" style="display:none">Logout</button>
<p id="loginMessage"></p>
</section>

<section id="adminPanel" class="panel" style="margin-top:20px">
<h2>Price Manager</h2>
<div id="adminPrices"></div>
<button id="saveBtn">Save Prices</button>
</section>

<p><small>Demo store. Payment is not enabled. No real orders or payments are processed.</small></p>
</main>

<script>
const SUPABASE_URL = "https://cvfmyfzhoxzrtzfzmgfq.supabase.co";
const SUPABASE_KEY = "sb_publishable_i2fAZZt8T-WkhbmuLy4hbg_zBhfXB6o";

const configured =
  SUPABASE_URL.startsWith("https://") &&
  !SUPABASE_URL.includes("PASTE_") &&
  !SUPABASE_KEY.includes("PASTE_");

const db = configured
  ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY)
  : null;

let cards = [];

const money = n => "₹" + Number(n).toLocaleString("en-IN");

async function loadCards() {
  if (!db) {
    document.getElementById("status").textContent =
      "Supabase URL aur Publishable Key add karo.";
    return;
  }

  const { data, error } = await db
    .from("gift_cards")
    .select("id,name,face_value,selling_price")
    .eq("active", true)
    .order("name");

  if (error) {
    document.getElementById("status").textContent =
      "Cards load nahi hue. Database permissions check karni hongi.";
    return;
  }

  cards = data || [];
  document.getElementById("status").textContent =
    cards.length ? "" : "Abhi koi active card nahi hai.";

  document.getElementById("products").innerHTML = cards.map(c => `
    <article class="card">
      <h3>${escapeHtml(c.name)}</h3>
      <p>Gift card value: ${money(c.face_value)}</p>
      <div class="price">${money(c.selling_price)}</div>
    </article>
  `).join("");

  renderAdmin();
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, ch => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;",
    '"':"&quot;", "'":"&#39;"
  }[ch]));
}

async function checkAdmin() {
  if (!db) return;

  const { data: { user } } = await db.auth.getUser();

  if (!user) {
    document.getElementById("adminPanel").style.display = "none";
    document.getElementById("logoutBtn").style.display = "none";
    return;
  }

  const { data, error } = await db
    .from("admin_users")
    .select("user_id")
    .eq("user_id", user.id)
    .maybeSingle();

  if (error || !data) {
    document.getElementById("loginMessage").textContent =
      "Yeh account authorized admin nahi hai.";
    await db.auth.signOut();
    return;
  }

  document.getElementById("adminPanel").style.display = "block";
  document.getElementById("logoutBtn").style.display = "inline-block";
  document.getElementById("loginMessage").textContent = "Admin login successful.";
  renderAdmin();
}

function renderAdmin() {
  document.getElementById("adminPrices").innerHTML = cards.map(c => `
    <div class="card" style="margin:12px 0">
      <strong>${escapeHtml(c.name)}</strong>
      <label>Gift card value
        <input type="number" min="1" id="value-${c.id}" value="${Number(c.face_value)}">
      </label>
      <label>Selling price
        <input type="number" min="1" id="price-${c.id}" value="${Number(c.selling_price)}">
      </label>
    </div>
  `).join("");
}

document.getElementById("loginBtn").onclick = async () => {
  if (!db) return alert("Pehle Supabase URL aur key add karo.");

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  const { error } = await db.auth.signInWithPassword({ email, password });

  if (error) {
    document.getElementById("loginMessage").textContent = error.message;
    return;
  }

  await checkAdmin();
};

document.getElementById("logoutBtn").onclick = async () => {
  await db.auth.signOut();
  document.getElementById("adminPanel").style.display = "none";
  document.getElementById("logoutBtn").style.display = "none";
  document.getElementById("loginMessage").textContent = "Logged out.";
};

document.getElementById("saveBtn").onclick = async () => {
  if (!db) return;

  const { data: { user } } = await db.auth.getUser();
  if (!user) return alert("Pehle admin login karo.");

  const { data: admin, error: adminError } = await db
    .from("admin_users")
    .select("user_id")
    .eq("user_id", user.id)
    .maybeSingle();

  if (adminError || !admin) {
    return alert("Admin permission nahi hai.");
  }

  for (const c of cards) {
    const value = Number(document.getElementById("value-" + c.id).value);
    const price = Number(document.getElementById("price-" + c.id).value);

    if (!Number.isFinite(value) || !Number.isFinite(price) ||
        value <= 0 || price <= 0) {
      return alert("Sabhi prices 0 se zyada honi chahiye.");
    }

    const { error } = await db.from("gift_cards")
      .update({ face_value: value, selling_price: price })
      .eq("id", c.id);

    if (error) return alert("Save nahi hua. Database policy check karo.");
  }

  alert("Prices save ho gayi!");
  await loadCards();
};

if (db) {
  db.auth.onAuthStateChange(() => {
    setTimeout(checkAdmin, 0);
  });
  loadCards();
} else {
  document.getElementById("status").textContent =
    "Code mein Supabase URL aur Publishable Key add karni hain.";
}
</script>
</body>
</html>
